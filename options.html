<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="appName">Minhas Tags de Afiliado</title>
    <link rel="stylesheet" href="M3/css/app.css">
    <style>
        body {
            box-sizing: border-box;
            font: 16px Arial, sans-serif;
            margin: 0 auto 32px;
            max-width: 720px;
            padding: 0 16px 52px;
        }

        .options-app-bar {
            background: var(--md-sys-color-surface-container);
            margin: 0 -16px 16px;
            padding: 16px;
        }

        .options-app-bar h1 {
            color: var(--md-sys-color-on-surface);
            font-size: 20px;
            font-weight: 500;
            margin: 0;
        }

        #theme-card {
            background: var(--md-sys-color-surface-container-low);
            border: 0;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow:
                0 1px 2px rgb(0 0 0 / 15%),
                0 1px 3px rgb(0 0 0 / 30%);
            margin: 0 0 16px;
            padding: 12px 16px;
            width: 100%;
        }

        #theme-card h2 {
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }

        .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 0;
            margin-top: 12px;
            width: 100%;
        }

        .theme-option {
            align-items: center;
            display: flex;
            flex: 1 1 110px;
            font-size: 14px;
            gap: 4px;
            min-width: 0;
        }

        .theme-option input {
            accent-color: var(--md-sys-color-primary);
            flex: 0 0 auto;
            height: 18px;
            margin: 0;
            min-height: 0;
            padding: 0;
            width: 18px;
        }

        #add-form {
            align-items: end;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 16px 0;
        }

        label {
            display: grid;
            gap: 4px;
        }

        input {
            min-width: 0;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
        }

        li {
            border-bottom: 1px solid #ddd;
            display: grid;
            gap: 8px;
            margin: 8px 0;
            padding: 8px 0;
        }

        .tag-fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .tag-url-field {
            grid-column: 1 / -1;
        }

        .add-url-field {
            grid-column: 1 / -1;
        }

        #add-error {
            color: var(--md-sys-color-error);
            grid-column: 1 / -1;
            min-height: 1.2em;
        }

        .tag-url-error {
            color: var(--md-sys-color-error);
            min-height: 1.2em;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }

        #status {
            min-height: 1.2em;
        }

        #extension-footer {
            border: 0;
            display: block;
            height: 36px;
            left: 0;
            position: fixed;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 100%;
        }
    </style>
</head>
<body>
<header class="options-app-bar">
    <h1 data-i18n="appName">Minhas Tags de Afiliado</h1>
</header>
<section id="theme-card" role="radiogroup" aria-labelledby="theme-card-heading">
    <h2 id="theme-card-heading" data-i18n="themePreferenceHeading">Tema da aplicação</h2>
    <div class="theme-options">
        <label class="theme-option" for="theme-system">
            <input id="theme-system" name="theme-preference" type="radio" value="system" checked>
            <span data-i18n="themeSystem">Sistema</span>
        </label>
        <label class="theme-option" for="theme-light">
            <input id="theme-light" name="theme-preference" type="radio" value="light">
            <span data-i18n="themeLight">Claro</span>
        </label>
        <label class="theme-option" for="theme-dark">
            <input id="theme-dark" name="theme-preference" type="radio" value="dark">
            <span data-i18n="themeDark">Escuro</span>
        </label>
    </div>
</section>
<p data-i18n="optionsIntro">As tags encontradas nas URLs da Amazon são salvas automaticamente neste navegador.</p>

<form id="add-form">
    <label for="new-description"><span data-i18n="optionalDescription">Descrição (opcional)</span>
        <input id="new-description" name="description">
    </label>
    <label class="add-url-field" for="new-url"><span data-i18n="originalUrlLabel">URL original</span>
        <input id="new-url" name="url" type="url" required>
    </label>
    <output id="add-error" class="add-url-field" aria-live="polite"></output>
    <output id="new-tag-preview" class="add-url-field" aria-live="polite"></output>
    <button id="add-button" type="submit" disabled data-i18n="addButton">Adicionar</button>
</form>

<h2 data-i18n="savedTagsHeading">Tags salvas</h2>
<ul id="tag-list"></ul>
<div class="toolbar">
    <button id="save-tags-button" type="button" disabled data-i18n="saveChangesButton">Salvar alterações</button>
    <button id="export-button" type="button" data-i18n="exportJsonButton">Exportar JSON</button>
    <button id="delete-all-button" type="button" disabled data-i18n="deleteAllButton">Excluir todas</button>
</div>

<section data-i18n-aria-label="manageTagsAriaLabel">
    <label for="import-file" data-i18n="importJsonLabel">Importar arquivo JSON (mesclar com a lista atual)</label>
    <input id="import-file" type="file" accept="application/json,.json">
</section>
<p id="status" role="status" aria-live="polite"></p>
<iframe id="extension-footer" src="footer.html" data-i18n-title="extensionFooterFrameTitle" title="Versão da extensão e autor do projeto"></iframe>
    <script src="i18n.js"></script>
    <script src="tag-utils.js"></script>
    <script src="M3/js/theme.js"></script>
    <script src="M3/js/interactions.js"></script>
    <script src="options.js"></script>
    </body>
    </html>
