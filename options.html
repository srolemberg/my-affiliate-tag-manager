<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="appName">Minhas Tags de Afiliado</title>
    <link rel="stylesheet" href="M3/css/app.css">
    <style>
        body {
            box-sizing: border-box;
            font: 16px Arial, sans-serif;
            margin: 0 auto 32px;
            max-width: 720px;
            padding: 0 16px 52px;
        }

        .options-app-bar {
            background: var(--md-sys-color-surface-container);
            margin: 0 -16px 16px;
            padding: 16px;
        }

        .options-app-bar h1 {
            color: var(--md-sys-color-on-surface);
            font-size: 20px;
            font-weight: 500;
            margin: 0;
        }

        #theme-card {
            background: var(--md-sys-color-surface-container-low);
            border: 0;
            border-radius: 12px;
            box-sizing: border-box;
            box-shadow:
                0 1px 2px rgb(0 0 0 / 15%),
                0 1px 3px rgb(0 0 0 / 30%);
            margin: 0 0 16px;
            padding: 12px 16px;
            width: 100%;
        }

        #theme-card h2 {
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }

        .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 0;
            margin-top: 12px;
            width: 100%;
        }

        .theme-option {
            align-items: center;
            display: flex;
            flex: 1 1 110px;
            font-size: 14px;
            gap: 4px;
            min-width: 0;
        }

        .theme-option input {
            accent-color: var(--md-sys-color-primary);
            flex: 0 0 auto;
            height: 18px;
            margin: 0;
            min-height: 0;
            padding: 0;
            width: 18px;
        }

        #add-form,
        #saved-tags-card,
        #import-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: 16px;
            box-shadow:
                0 1px 2px rgb(0 0 0 / 15%),
                0 1px 3px rgb(0 0 0 / 30%);
            margin: 16px 0;
            overflow: hidden;
            width: 100%;
        }

        .add-card-header,
        .saved-tags-header,
        .import-card-header {
            padding: 20px 16px 12px;
        }

        .add-card-header h2,
        .saved-tags-header h2,
        .import-card-header h2 {
            color: var(--md-sys-color-on-surface);
            font-size: 22px;
            font-weight: 400;
            line-height: 28px;
            margin: 0;
        }

        .add-card-header p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
        }

        .import-card-content {
            background: var(--md-sys-color-surface-container);
            display: grid;
            gap: 8px;
            padding: 16px;
        }

        .import-card-content label {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
        }

        .import-card-content input {
            background: transparent;
            box-sizing: border-box;
            min-width: 0;
            width: 100%;
        }

        .import-card-content input[type="file"]::file-selector-button {
            background: var(--md-sys-color-primary);
            border: 1px solid var(--md-sys-color-primary);
            border-radius: 20px;
            color: var(--md-sys-color-on-primary);
            cursor: pointer;
            font: inherit;
            margin-right: 12px;
            min-height: 40px;
            padding: 8px 16px;
            transition:
                background-color 150ms ease,
                border-color 150ms ease,
                box-shadow 150ms ease;
        }

        .import-card-content input[type="file"]::file-selector-button:hover {
            box-shadow:
                0 1px 2px rgb(0 0 0 / 30%),
                0 1px 3px 1px rgb(0 0 0 / 15%);
        }

        .import-card-content input[type="file"]::file-selector-button:active {
            box-shadow: none;
        }

        .add-card-fields,
        .saved-tags-content {
            background: var(--md-sys-color-surface-container);
            padding: 16px;
        }

        .add-card-fields {
            display: grid;
            gap: 16px;
        }

        #tag-list {
            background: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 16px;
            list-style: none;
            margin: 0;
            overflow: hidden;
            padding: 0;
        }

        #tag-list li[data-original-tag] {
            align-items: center;
            background: var(--md-sys-color-surface-container-low);
            display: grid;
            gap: 0 12px;
            grid-template-columns: minmax(0, 1fr) 40px;
            margin: 0;
            padding: 16px;
        }

        #tag-list li[data-original-tag]:first-child {
            border-radius: 16px 16px 0 0;
        }

        #tag-list li[data-original-tag]:last-child {
            border-radius: 0 0 16px 16px;
        }

        #tag-list li[data-original-tag]:first-child:last-child {
            border-radius: 16px;
        }

        #tag-list .empty-tag-list {
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
            padding: 16px;
        }

        #tag-list .m3-divider {
            background: var(--md-sys-color-outline-variant);
            border: 0;
            height: 2px;
            grid-column: 1 / -1;
            margin: 16px -16px -16px;
            width: calc(100% + 32px);
        }

        .saved-tag-content {
            min-width: 0;
        }

        .tag-key-display {
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            font-weight: 500;
            line-height: 24px;
            margin: 0 0 12px;
            overflow-wrap: anywhere;
        }

        .text-field {
            min-width: 0;
            position: relative;
        }

        .text-field input {
            background: transparent;
            box-sizing: border-box;
            height: 56px;
            min-width: 0;
            padding: 20px 12px 8px;
            width: 100%;
        }

        .text-field-label {
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface-variant);
            cursor: text;
            display: block;
            left: 12px;
            padding: 0 4px;
            pointer-events: none;
            position: absolute;
            top: 17px;
            transition:
                color 150ms ease,
                font-size 150ms ease,
                left 150ms ease,
                top 150ms ease;
        }

        .text-field input:focus {
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
            outline: none;
        }

        .text-field input:focus + .text-field-label,
        .text-field input:not(:placeholder-shown) + .text-field-label {
            font-size: 12px;
            left: 8px;
            top: -8px;
        }

        .text-field input:focus + .text-field-label {
            color: var(--md-sys-color-primary);
        }

        .text-field input[aria-invalid="true"] {
            border-color: var(--md-sys-color-error);
        }

        .text-field input[aria-invalid="true"] + .text-field-label {
            color: var(--md-sys-color-error);
        }

        #add-error,
        #new-tag-preview {
            font-size: 12px;
            line-height: 16px;
        }

        #add-error {
            color: var(--md-sys-color-error);
        }

        #new-tag-preview {
            color: var(--md-sys-color-on-surface-variant);
        }

        #add-error:empty,
        #new-tag-preview:empty {
            display: none;
        }

        .add-card-footer {
            display: flex;
            justify-content: flex-end;
            padding: 8px 16px 16px;
        }

        button {
            padding: 8px 24px;
        }

        .tag-fields {
            display: grid;
            gap: 12px;
        }

        .tag-fields .text-field {
            min-width: 0;
        }

        .delete-tag-button {
            align-items: center;
            background: transparent;
            border: 0;
            border-radius: 50%;
            color: var(--md-sys-color-error);
            display: inline-flex;
            grid-column: 2;
            grid-row: 1;
            height: 40px;
            justify-content: center;
            padding: 8px;
            width: 40px;
        }

        .saved-tag-content {
            grid-column: 1;
            grid-row: 1;
        }

        .delete-tag-button:hover {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        .delete-tag-button svg {
            fill: currentColor;
            height: 20px;
            width: 20px;
        }

        .tag-url-error {
            color: var(--md-sys-color-error);
            display: block;
            font-size: 12px;
            line-height: 16px;
            padding: 4px 12px 0;
        }

        .tag-url-error:empty {
            display: none;
        }

        label {
            display: grid;
            gap: 4px;
        }

        input {
            min-width: 0;
            padding: 8px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            margin: 0;
            padding: 8px 16px 16px;
        }

        .toolbar .button-secondary {
            background: var(--md-sys-color-secondary-container);
            border-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .toolbar .button-tertiary {
            background: transparent;
            border-color: var(--md-sys-color-outline);
            color: var(--md-sys-color-primary);
        }

        #status {
            min-height: 1.2em;
        }

        #extension-footer {
            border: 0;
            display: block;
            height: 36px;
            left: 0;
            position: fixed;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 100%;
        }
    </style>
</head>
<body>
<header class="options-app-bar">
    <h1 data-i18n="appName">Minhas Tags de Afiliado</h1>
</header>
<section id="theme-card" role="radiogroup" aria-labelledby="theme-card-heading">
    <h2 id="theme-card-heading" data-i18n="themePreferenceHeading">Tema da aplicação</h2>
    <div class="theme-options">
        <label class="theme-option" for="theme-system" data-i18n-title="themeSystemTooltip" title="Tema da aplicação: Sistema">
            <input id="theme-system" name="theme-preference" type="radio" value="system" checked data-i18n-title="themeSystemTooltip" title="Tema da aplicação: Sistema">
            <span data-i18n="themeSystem">Sistema</span>
        </label>
        <label class="theme-option" for="theme-light" data-i18n-title="themeLightTooltip" title="Tema da aplicação: Claro">
            <input id="theme-light" name="theme-preference" type="radio" value="light" data-i18n-title="themeLightTooltip" title="Tema da aplicação: Claro">
            <span data-i18n="themeLight">Claro</span>
        </label>
        <label class="theme-option" for="theme-dark" data-i18n-title="themeDarkTooltip" title="Tema da aplicação: Escuro">
            <input id="theme-dark" name="theme-preference" type="radio" value="dark" data-i18n-title="themeDarkTooltip" title="Tema da aplicação: Escuro">
            <span data-i18n="themeDark">Escuro</span>
        </label>
    </div>
</section>
<form id="add-form" class="add-card">
    <header class="add-card-header">
        <h2 data-i18n="manualAddHeading">Adicionar tag</h2>
        <p data-i18n="optionsIntro">As tags encontradas em URLs da Amazon são salvas automaticamente neste navegador.</p>
    </header>
    <div class="add-card-fields">
        <div class="text-field">
            <input id="new-description" name="description" placeholder=" ">
            <label class="text-field-label" for="new-description" data-i18n="optionalDescription">Descrição (opcional)</label>
        </div>
        <div class="text-field">
            <input id="new-url" name="url" type="url" placeholder=" " required aria-describedby="add-error new-tag-preview">
            <label class="text-field-label" for="new-url" data-i18n="originalUrlLabel">URL original</label>
        </div>
        <output id="add-error" aria-live="polite"></output>
        <output id="new-tag-preview" aria-live="polite"></output>
    </div>
    <footer class="add-card-footer">
        <button id="add-button" type="submit" disabled data-i18n="addButton" data-i18n-title="addButton" title="Adicionar">Adicionar</button>
    </footer>
</form>

<section id="saved-tags-card" aria-labelledby="saved-tags-heading">
    <header class="saved-tags-header">
        <h2 id="saved-tags-heading" data-i18n="savedTagsHeading">Tags salvas</h2>
    </header>
    <div class="saved-tags-content">
        <ul id="tag-list"></ul>
    </div>
    <footer class="toolbar">
        <button id="save-tags-button" class="button-primary" type="button" disabled data-i18n="saveChangesButton" data-i18n-title="saveChangesButton" title="Salvar alterações">Salvar alterações</button>
        <button id="export-button" class="button-secondary" type="button" data-i18n="exportJsonButton" data-i18n-title="exportJsonButton" title="Exportar JSON">Exportar JSON</button>
        <button id="delete-all-button" class="button-tertiary" type="button" disabled data-i18n="deleteAllButton" data-i18n-title="deleteAllButton" title="Excluir todas">Excluir todas</button>
    </footer>
</section>

<section id="import-card" data-i18n-aria-label="manageTagsAriaLabel">
    <header class="import-card-header">
        <h2 data-i18n="importCardHeading">Importar tags</h2>
    </header>
    <div class="import-card-content">
        <label for="import-file" data-i18n="importJsonLabel">Importar arquivo JSON (mesclar com a lista atual)</label>
        <input id="import-file" type="file" accept="application/json,.json" data-i18n-title="importJsonLabel" title="Importar arquivo JSON (mesclar com a lista atual)">
    </div>
</section>
<p id="status" role="status" aria-live="polite"></p>
<iframe id="extension-footer" src="footer.html" data-i18n-title="extensionFooterFrameTitle" title="Versão da extensão e autor do projeto"></iframe>
    <script src="i18n.js"></script>
    <script src="tag-utils.js"></script>
    <script src="M3/js/theme.js"></script>
    <script src="M3/js/interactions.js"></script>
    <script src="options.js"></script>
    </body>
    </html>
