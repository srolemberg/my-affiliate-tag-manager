<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="appName">Minhas Tags de Afiliado</title>
    <link rel="stylesheet" href="M3/css/app.css">
    <style>
        body {
            box-sizing: border-box;
            font: 16px/24px Roboto, Arial, sans-serif;
            margin: 0 auto 32px;
            max-width: 720px;
            padding: 0 16px 52px;
        }

        .options-app-bar {
            align-items: center;
            background: var(--md-sys-color-surface-container);
            display: flex;
            gap: 16px;
            justify-content: space-between;
            margin: 0 -16px 16px;
            padding: 16px;
        }

        .options-app-bar-heading {
            flex: 1;
            min-width: 0;
        }

        .options-app-bar h1 {
            color: var(--md-sys-color-on-surface);
            font-size: 22px;
            font-weight: 400;
            line-height: 28px;
            margin: 0;
        }

        .options-app-bar p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
        }

        .app-bar-action-link {
            isolation: isolate;
            overflow: hidden;
            position: relative;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition:
                background-color 150ms ease,
                box-shadow 150ms ease,
                color 150ms ease;
        }

        .app-bar-action-link::before {
            background: currentColor;
            border-radius: inherit;
            content: "";
            inset: 0;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            transition: opacity 150ms ease;
            z-index: -1;
        }

        .app-bar-action-link:hover::before {
            opacity: 0.08;
        }

        .app-bar-action-link:focus-visible::before,
        .app-bar-action-link:active::before {
            opacity: 0.12;
        }

        .app-bar-action-link:active::before {
            transition-duration: 0ms;
        }

        @media (prefers-reduced-motion: reduce) {
            .app-bar-action-link,
            .app-bar-action-link::before {
                transition-duration: 0.01ms;
            }
        }

        .theme-card-header {
            padding: 20px 16px 12px;
        }

        .theme-card-content {
            background: var(--md-sys-color-surface-container);
            padding: 16px;
        }

        #theme-card h2 {
            color: var(--md-sys-color-on-surface);
            font-size: 22px;
            font-weight: 400;
            line-height: 28px;
            margin: 0;
        }

        .theme-card-supporting-text {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
        }

        .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 8px;
            margin-top: 0;
            width: 100%;
        }

        .theme-option {
            align-items: center;
            display: flex;
            flex: 1 1 110px;
            font-size: 14px;
            gap: 8px;
            line-height: 20px;
            min-width: 0;
        }

        .theme-option input {
            accent-color: var(--md-sys-color-primary);
            flex: 0 0 auto;
            height: 20px;
            margin: 0;
            min-height: 0;
            padding: 0;
            width: 20px;
        }

        #theme-card,
        #add-form,
        #saved-tags-card {
            background: var(--md-sys-color-surface-container-low);
            border-radius: 16px;
            box-shadow:
                0 1px 2px color-mix(in srgb, var(--md-sys-color-shadow) 15%, transparent),
                0 1px 3px color-mix(in srgb, var(--md-sys-color-shadow) 30%, transparent);
            box-sizing: border-box;
            margin: 16px 0;
            overflow: hidden;
            padding: 0;
            width: 100%;
        }

        .add-card-header {
            padding: 20px 16px 12px;
        }

        .saved-tags-header-row {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .saved-tags-header-heading {
            flex: 1;
            min-width: 0;
        }

        .saved-tags-header-actions {
            align-items: center;
            display: flex;
            flex: 0 0 auto;
            gap: 4px;
        }

        .app-bar-action {
            align-items: center;
            background: transparent;
            border: 0;
            border-radius: 50%;
            color: var(--md-sys-color-on-surface-variant);
            display: inline-flex;
            flex: 0 0 40px;
            height: 40px;
            justify-content: center;
            min-height: 40px;
            padding: 0;
            width: 40px;
        }

        .app-bar-action svg {
            fill: currentColor;
            height: 24px;
            width: 24px;
        }

        #import-file {
            display: none;
        }

        .add-card-header h2 {
            color: var(--md-sys-color-on-surface);
            font-size: 22px;
            font-weight: 400;
            line-height: 28px;
            margin: 0;
        }

        .add-card-header p {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
        }

        .add-card-fields,
        .saved-tags-content {
            background: var(--md-sys-color-surface-container);
            padding: 16px;
        }

        .add-card-fields {
            display: grid;
            gap: 16px;
        }

        #tag-list {
            background: var(--md-sys-color-surface-container-low);
            border: 1px solid var(--md-sys-color-outline-variant);
            border-radius: 16px;
            list-style: none;
            margin: 0;
            overflow: hidden;
            padding: 0;
        }

        #tag-list li[data-original-tag] {
            align-items: center;
            background: var(--md-sys-color-surface-container-low);
            display: grid;
            gap: 0 12px;
            grid-template-columns: minmax(0, 1fr) 56px;
            margin: 0;
            padding: 16px;
        }

        #tag-list li[data-original-tag]:first-child {
            border-radius: 16px 16px 0 0;
        }

        #tag-list li[data-original-tag]:last-child {
            border-radius: 0 0 16px 16px;
        }

        #tag-list li[data-original-tag]:first-child:last-child {
            border-radius: 16px;
        }

        #tag-list .empty-tag-list {
            color: var(--md-sys-color-on-surface-variant);
            margin: 0;
            padding: 16px;
        }

        #tag-list .m3-divider {
            background: var(--md-sys-color-outline-variant);
            border: 0;
            height: 2px;
            grid-column: 1 / -1;
            margin: 16px -16px -16px;
            width: calc(100% + 32px);
        }

        .saved-tag-content {
            min-width: 0;
        }

        .tag-key-display {
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            font-weight: 500;
            line-height: 24px;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .saved-tag-heading {
            margin-bottom: 12px;
        }

        .saved-tag-supporting-text {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
            overflow-wrap: anywhere;
        }

        .text-field {
            min-width: 0;
            position: relative;
        }

        .text-field input {
            background: transparent;
            box-sizing: border-box;
            height: 56px;
            min-width: 0;
            padding: 20px 12px 8px;
            width: 100%;
        }

        .text-field-label {
            background: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface-variant);
            cursor: text;
            display: block;
            left: 12px;
            padding: 0 4px;
            pointer-events: none;
            position: absolute;
            top: 17px;
            transition:
                color 150ms ease,
                font-size 150ms ease,
                left 150ms ease,
                top 150ms ease;
        }

        .text-field input:focus {
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
            outline: none;
        }

        .text-field input:focus + .text-field-label,
        .text-field input:not(:placeholder-shown) + .text-field-label {
            font-size: 12px;
            left: 8px;
            top: -8px;
        }

        .text-field input:focus + .text-field-label {
            color: var(--md-sys-color-primary);
        }

        .text-field input[aria-invalid="true"] {
            border-color: var(--md-sys-color-error);
        }

        .text-field input[aria-invalid="true"] + .text-field-label {
            color: var(--md-sys-color-error);
        }

        #add-error,
        #new-tag-preview {
            font-size: 12px;
            line-height: 16px;
        }

        #add-error {
            color: var(--md-sys-color-error);
        }

        #new-tag-preview {
            color: var(--md-sys-color-on-surface-variant);
        }

        #add-error:empty,
        #new-tag-preview:empty {
            display: none;
        }

        .add-card-footer {
            display: flex;
            justify-content: flex-end;
            padding: 8px 16px 16px;
        }

        button {
            padding: 8px 24px;
        }

        .tag-fields {
            background: var(--md-sys-color-surface-container);
            display: grid;
            gap: 16px;
            margin: 0 -16px -16px;
            padding: 16px 0 16px 16px;
        }

        .tag-fields .text-field {
            margin-right: 16px;
            min-width: 0;
        }

        .delete-tag-button {
            align-items: center;
            background: transparent;
            border: 0;
            border-radius: 50%;
            color: var(--md-sys-color-error);
            display: inline-flex;
            grid-column: 2;
            grid-row: 1;
            height: 40px;
            justify-content: center;
            margin-left: 16px;
            padding: 8px;
            width: 40px;
        }

        .saved-tag-content {
            grid-column: 1;
            grid-row: 1;
        }

        .delete-tag-button:hover {
            background: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        .delete-tag-button svg {
            fill: currentColor;
            height: 20px;
            width: 20px;
        }

        .tag-url-error {
            color: var(--md-sys-color-error);
            display: block;
            font-size: 12px;
            line-height: 16px;
            padding: 4px 12px 0;
        }

        .tag-url-error:empty {
            display: none;
        }

        label {
            display: grid;
            gap: 4px;
        }

        input {
            min-width: 0;
            padding: 8px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            margin: 0;
            padding: 8px 16px 16px;
        }

        .toolbar .button-secondary {
            background: var(--md-sys-color-secondary-container);
            border-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .toolbar .button-tertiary {
            background: transparent;
            border-color: var(--md-sys-color-outline);
            color: var(--md-sys-color-primary);
        }

        #status {
            color: var(--md-sys-color-on-surface-variant);
            font-size: 14px;
            line-height: 20px;
            margin: 4px 0 0;
            min-height: 0;
        }

        #status:empty {
            display: none;
        }

        #extension-footer {
            border: 0;
            display: block;
            height: 36px;
            left: 0;
            position: fixed;
            right: 0;
            bottom: 0;
            z-index: 1;
            width: 100%;
        }
    </style>
</head>
<body>
<header class="options-app-bar">
    <div class="options-app-bar-heading">
        <h1 data-i18n="appName">Minhas Tags de Afiliado</h1>
        <p data-i18n="optionsScreenSupportingText">Configurações</p>
    </div>
    <a id="report-problem-link" class="app-bar-action app-bar-action-link" href="https://github.com/srolemberg/my-affiliate-tag-manager/issues" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="reportProblems" data-i18n-title="reportProblems" title="Reportar problemas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8h-2.81a5.99 5.99 0 0 0-1.1-1.65l1.45-1.45L16.12 3.5l-1.7 1.7a5.984 5.984 0 0 0-4.84 0l-1.7-1.7L6.46 4.9l1.45 1.45A5.985 5.985 0 0 0 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81A6.004 6.004 0 0 0 12 21a6.004 6.004 0 0 0 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/></svg>
    </a>
    <a id="rate-app-link" class="app-bar-action app-bar-action-link" href="https://chromewebstore.google.com/detail/khffmniafjplifpandmgibpkkfbbbnom?utm_source=item-share-app" target="_blank" rel="noopener noreferrer" data-i18n-aria-label="rateApp" data-i18n-title="goToStoreTooltip" title="Ir para a loja">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 17.27 5.18 3.13-1.64-7.03L21 8.64l-7.19-.61L12 1.4 9.19 8.03 2 8.64l5.46 4.73-1.64 7.03L12 17.27Z"/></svg>
    </a>
</header>
<section id="theme-card" role="radiogroup" aria-labelledby="theme-card-heading">
    <header class="theme-card-header">
        <h2 id="theme-card-heading" data-i18n="themePreferenceHeading">Tema da aplicação</h2>
        <p class="theme-card-supporting-text" data-i18n="themePreferenceIntro">Escolha o tema usado nas páginas da extensão.</p>
    </header>
    <div class="theme-card-content">
        <div class="theme-options">
            <label class="theme-option" for="theme-system" data-i18n-title="themeSystemTooltip" title="Tema da aplicação: Sistema">
                <input id="theme-system" name="theme-preference" type="radio" value="system" checked data-i18n-title="themeSystemTooltip" title="Tema da aplicação: Sistema">
                <span data-i18n="themeSystem">Sistema</span>
            </label>
            <label class="theme-option" for="theme-light" data-i18n-title="themeLightTooltip" title="Tema da aplicação: Claro">
                <input id="theme-light" name="theme-preference" type="radio" value="light" data-i18n-title="themeLightTooltip" title="Tema da aplicação: Claro">
                <span data-i18n="themeLight">Claro</span>
            </label>
            <label class="theme-option" for="theme-dark" data-i18n-title="themeDarkTooltip" title="Tema da aplicação: Escuro">
                <input id="theme-dark" name="theme-preference" type="radio" value="dark" data-i18n-title="themeDarkTooltip" title="Tema da aplicação: Escuro">
                <span data-i18n="themeDark">Escuro</span>
            </label>
        </div>
    </div>
</section>
<form id="add-form" class="add-card">
    <header class="add-card-header">
        <h2 data-i18n="manualAddHeading">Adicionar tag</h2>
        <p data-i18n="optionsIntro">Adicione uma tag manualmente informando a URL original da Amazon; a chave será extraída automaticamente.</p>
    </header>
    <div class="add-card-fields">
        <div class="text-field">
            <input id="new-description" name="description" placeholder=" ">
            <label class="text-field-label" for="new-description" data-i18n="optionalDescription">Descrição (opcional)</label>
        </div>
        <div class="text-field">
            <input id="new-url" name="url" type="url" placeholder=" " required aria-describedby="add-error new-tag-preview">
            <label class="text-field-label" for="new-url" data-i18n="originalUrlLabel">URL original</label>
        </div>
        <output id="add-error" aria-live="polite"></output>
        <output id="new-tag-preview" aria-live="polite"></output>
    </div>
    <footer class="add-card-footer">
        <button id="add-button" type="submit" disabled data-i18n="addButton" data-i18n-title="addButton" title="Adicionar">Adicionar</button>
    </footer>
</form>

<section id="saved-tags-card" aria-labelledby="saved-tags-heading">
    <header class="add-card-header saved-tags-header">
        <div class="saved-tags-header-row">
            <div class="saved-tags-header-heading">
                <h2 id="saved-tags-heading" data-i18n="savedTagsHeading">Tags salvas</h2>
                <p id="status" role="status" aria-live="polite"></p>
            </div>
            <div class="saved-tags-header-actions">
        <button id="import-button" class="app-bar-action" type="button" data-i18n-aria-label="importJsonLabel" data-i18n-title="importJsonLabel" title="Importar arquivo JSON (mesclar com a lista atual)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15V18H6V15H4V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V15H18ZM7 9L8.41 10.41L11 7.83V16H13V7.83L15.59 10.41L17 9L12 4L7 9Z"/></svg>
        </button>
        <button id="export-button" class="app-bar-action" type="button" data-i18n-aria-label="exportJsonButton" data-i18n-title="exportJsonButton" title="Exportar JSON">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 15V18H6V15H4V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V15H18ZM17 11L15.59 9.59L13 12.17V4H11V12.17L8.41 9.59L7 11L12 16L17 11Z"/></svg>
        </button>
            </div>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" data-i18n-title="importJsonLabel" title="Importar arquivo JSON (mesclar com a lista atual)">
    </header>
    <div class="saved-tags-content">
        <ul id="tag-list"></ul>
    </div>
    <footer class="toolbar">
        <button id="save-tags-button" class="button-primary" type="button" disabled data-i18n="saveChangesButton" data-i18n-title="saveChangesButton" title="Salvar alterações">Salvar alterações</button>
        <button id="delete-all-button" class="button-tertiary" type="button" disabled data-i18n="deleteAllButton" data-i18n-title="deleteAllButton" title="Excluir todas">Excluir todas</button>
    </footer>
</section>

<iframe id="extension-footer" src="footer.html" data-i18n-title="extensionFooterFrameTitle" title="Versão da extensão e autor do projeto"></iframe>
    <script src="i18n.js"></script>
    <script src="tag-utils.js"></script>
    <script src="M3/js/theme.js"></script>
    <script src="M3/js/interactions.js"></script>
    <script src="options.js"></script>
    </body>
    </html>
